[project]
name = "ons-sentinel-core"
version = "0.1.0"
description = "Modular autonomy, simulation, perception and mission orchestration layer for light UAVs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
    "loguru>=0.7",
    "opencv-python>=4.0",
    "numpy>=1.24",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "jinja2>=3.1",
    "websockets>=12.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
mavlink = [
    "mavsdk>=2.0.0",
]
perception = [
    "ultralytics",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["sentinel*", "apps*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_unused_ignores = false
warn_return_any = false
exclude = ["runs", ".venv"]

[[tool.mypy.overrides]]
module = ["cv2", "typer", "numpy", "loguru"]
ignore_errors = true
